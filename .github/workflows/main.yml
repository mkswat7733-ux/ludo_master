name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if it was uploaded as a .zip)
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -q -o "$z"; fi
          done
          true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find project folder (the one that has gradlew)
        id: find
        run: |
          G=$(find . -maxdepth 3 -name gradlew | head -1)
          if [ -z "$G" ]; then echo "gradlew not found"; ls -R | head -50; exit 1; fi
          echo "gradlew found at: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Android SDK licenses and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoMaster-apk
          path: '**/build/outputs/apk/debug/*.apk'
